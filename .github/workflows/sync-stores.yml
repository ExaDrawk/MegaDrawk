name: Sync public store listings
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-listings
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run sync:stores
      - run: npx prettier --write src/config/store-listings.json
      - run: npm run check
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/store-listings.json public/images/projects/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public Google Play listings"
            git push
          fi
